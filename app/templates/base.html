<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Corse Podistiche{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1><a href="{{ url_for('main.index') }}">Corse Podistiche</a></h1>
            <div class="navbar-user">
                {% if session.get('username') %}
                    <div class="user-menu">
                        <button class="user-menu-button" type="button" aria-expanded="false" aria-controls="user-menu-dropdown">
                            Ciao, <strong>{{ session['username'] }}</strong>
                            <span class="burger-icon">☰</span>
                        </button>
                        <div id="user-menu-dropdown" class="user-menu-dropdown" hidden>
                            <a href="{{ url_for('main.change_password') }}">Modifica password</a>
                            <a href="{{ url_for('main.logout') }}">Logout</a>
                        </div>
                    </div>
                {% else %}
                    <a href="{{ url_for('main.login') }}" class="btn-login">Login</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
