{% extends "base.html" %}

{% block title %}Login - Corse Podistiche{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h2>Accedi</h2>
        
        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        
        <form method="POST" action="{{ url_for('main.login') }}">
            <div class="form-group">
                <label for="username">Nome Utente:</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Inserisci il tuo nome" 
                    required
                    autofocus
                >
            </div>
            
            <div class="form-group password-group">
                <label for="password">Password:</label>
                <div class="password-input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="password-toggle"
                        placeholder="Inserisci la password" 
                        required
                    >
                    <button type="button" class="password-toggle-button" aria-label="Mostra password">👁</button>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary">Accedi</button>
        </form>
        
        <p class="info">Non hai un account? <a href="{{ url_for('main.register') }}">Registrati qui</a></p>
    </div>
</div>
{% endblock %}
