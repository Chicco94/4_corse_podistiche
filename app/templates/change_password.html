{% extends "base.html" %}

{% block title %}Modifica Password - Corse Podistiche{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-box">
        <h2>Modifica Password</h2>

        {% if error %}
            <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        {% if success %}
            <div class="alert">{{ success }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('main.change_password') }}">
            <div class="form-group password-group">
                <label for="current_password">Password attuale:</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="current_password"
                        name="current_password"
                        class="password-toggle"
                        placeholder="Inserisci la password attuale"
                        required
                    >
                    <button type="button" class="password-toggle-button" aria-label="Mostra password">👁</button>
                </div>
            </div>

            <div class="form-group password-group">
                <label for="new_password">Nuova password:</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        class="password-toggle"
                        placeholder="Almeno 6 caratteri"
                        required
                        minlength="6"
                    >
                    <button type="button" class="password-toggle-button" aria-label="Mostra password">👁</button>
                </div>
            </div>

            <div class="form-group password-group">
                <label for="new_password_confirm">Conferma nuova password:</label>
                <div class="password-input-wrapper">
                    <input
                        type="password"
                        id="new_password_confirm"
                        name="new_password_confirm"
                        class="password-toggle"
                        placeholder="Ripeti la nuova password"
                        required
                        minlength="6"
                    >
                    <button type="button" class="password-toggle-button" aria-label="Mostra password">👁</button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Aggiorna password</button>
        </form>
    </div>
</div>
{% endblock %}
